name: Update compatibility_date

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # Only package metadata is read below, so install scripts stay off.
      - run: npm ci --ignore-scripts

      - name: Update compatibility_date
        run: |
          # Tests run on the workerd bundled with @cloudflare/vitest-pool-workers,
          # which lags behind wrangler's. A date newer than that runtime supports
          # makes every test fail to boot, so cap the proposal at its date.
          TEST_RUNTIME_DATE=$(node -p "
            const { createRequire } = require('node:module');
            const pool = createRequire(require('node:path').resolve('node_modules/@cloudflare/vitest-pool-workers/package.json'));
            createRequire(pool.resolve('miniflare'))('workerd').compatibilityDate
          ")
          CANDIDATE=$(date -u -d '-7 days' +%Y-%m-%d)
          NEW_DATE=$(printf '%s\n' "$CANDIDATE" "$TEST_RUNTIME_DATE" | sort | head -n 1)
          CURRENT=$(grep -oP '"compatibility_date": "\K[0-9-]+' wrangler.jsonc)
          echo "current=$CURRENT candidate=$CANDIDATE test-runtime=$TEST_RUNTIME_DATE"
          if [[ ! "$NEW_DATE" > "$CURRENT" ]]; then
            echo "Nothing to update (the test runtime does not support a newer date yet)"
            exit 0
          fi
          sed -i "s/\"compatibility_date\": \"[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\"/\"compatibility_date\": \"$NEW_DATE\"/" wrangler.jsonc
          echo "Updated compatibility_date to $NEW_DATE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: 'chore: update compatibility_date'
          branch: chore/update-compat-date
          title: 'chore: update Cloudflare compatibility_date'
          body: |
            `wrangler.jsonc` の `compatibility_date` を自動更新しました。

            [Cloudflare changelog](https://developers.cloudflare.com/workers/configuration/compatibility-dates/) で breaking change がないか確認してからマージしてください。
          delete-branch: true
