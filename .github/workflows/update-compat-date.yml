name: Update compatibility_date

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update compatibility_date
        run: |
          NEW_DATE=$(date -d '-7 days' +%Y-%m-%d)
          sed -i "s/\"compatibility_date\": \"[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\"/\"compatibility_date\": \"$NEW_DATE\"/" wrangler.jsonc
          echo "Updated compatibility_date to $NEW_DATE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update compatibility_date'
          branch: chore/update-compat-date
          title: 'chore: update Cloudflare compatibility_date'
          body: |
            `wrangler.jsonc` の `compatibility_date` を自動更新しました。

            [Cloudflare changelog](https://developers.cloudflare.com/workers/configuration/compatibility-dates/) で breaking change がないか確認してからマージしてください。
          delete-branch: true
