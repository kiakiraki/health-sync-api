version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      cloudflare:
        patterns:
          - 'wrangler'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@cloudflare/vitest-pool-workers'
    ignore:
      # @cloudflare/vitest-pool-workers peers on vitest ^4.1 — drop this once
      # a pool-workers release supports vitest 5.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'github-actions'
